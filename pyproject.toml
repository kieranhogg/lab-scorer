[project]
name = "lab-scorer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "textual-terminal>=0.3.0",
]

[project.scripts]
start = "labtools.start:main"
check = "labtools.check:main"
next = "labtools.next:main"
back = "labtools.back:main"
hint = "labtools.hint:main"
helpme = "labtools.helpme:main"
lablint = "labtools.lint:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "labtools"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "jscpd>=5.4.2",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]
